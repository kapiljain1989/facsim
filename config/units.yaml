# Production units. `sequence` defines process order; `process_stage` is the
# token products reference in their manufacturing_process route.
#
# Unit count, worker headcount and staffing roles are all config: change them
# here and the factory builder, shift rosters and tests follow.

worker_roles: [OPERATOR, SENIOR_OPERATOR]
manager_role: UNIT_MANAGER
technician_role: TECHNICIAN
qc_analyst_role: QC_ANALYST
skill_levels: [JUNIOR, INTERMEDIATE, SENIOR]

# Site tenure. hired_on is the run start minus a draw from this range, capped by
# each person's experience_years. Keep the maximum at or below the site's own
# age -- the earliest commissioned_from in machines.yaml is the practical bound.
tenure_years_min: 0.25
tenure_years_max: 7.0

units:
  - id: UNIT-01
    name: Raw Material Dispensing
    sequence: 1
    process_stage: DISPENSING
    worker_count: 10
    environment_sensitivity: 1.2

  - id: UNIT-02
    name: Granulation
    sequence: 2
    process_stage: GRANULATION
    worker_count: 10
    environment_sensitivity: 1.1

  - id: UNIT-03
    name: Drying
    sequence: 3
    process_stage: DRYING
    worker_count: 10
    environment_sensitivity: 1.4

  - id: UNIT-04
    name: Milling
    sequence: 4
    process_stage: MILLING
    worker_count: 10
    environment_sensitivity: 1.0

  - id: UNIT-05
    name: Blending
    sequence: 5
    process_stage: BLENDING
    worker_count: 10
    environment_sensitivity: 1.0

  - id: UNIT-06
    name: Tablet Compression
    sequence: 6
    process_stage: COMPRESSION
    worker_count: 10
    environment_sensitivity: 1.3

  - id: UNIT-07
    name: Tablet Coating
    sequence: 7
    process_stage: COATING
    worker_count: 10
    environment_sensitivity: 1.5

  - id: UNIT-08
    name: Capsule Filling
    sequence: 8
    process_stage: CAPSULE_FILLING
    worker_count: 10
    environment_sensitivity: 1.2

  - id: UNIT-09
    name: Packaging
    sequence: 9
    process_stage: PACKAGING
    worker_count: 10
    environment_sensitivity: 0.8

  - id: UNIT-10
    name: Sterilization and Utilities
    sequence: 10
    process_stage: STERILIZATION
    worker_count: 10
    environment_sensitivity: 1.6

  # ---- Containment suite --------------------------------------------------
  # A dedicated, self-contained line for the oncology programme. An OEB 4 API
  # cannot be handled in the units above: they run several products through
  # shared equipment, and the health-based exposure limit for a potent compound
  # makes the carry-over risk unacceptable in both directions.
  #
  # Four units rather than one, because a unit performs one process stage. What
  # makes them a suite is that they share an air-handling boundary and a cleaning
  # regime, and that no other product is routed through them.
  #
  # Headcount is low and the environment sensitivity is high: gowning limits how
  # many people are in the suite, and a contained line is more sensitive to its
  # own environment than an open one because the containment IS the environment.
  - id: UNIT-11
    name: Contained Dispensing (Oncology Suite)
    sequence: 11
    process_stage: CONTAINED_DISPENSING
    worker_count: 4
    environment_sensitivity: 1.8

  - id: UNIT-12
    name: Contained Blending (Oncology Suite)
    sequence: 12
    process_stage: CONTAINED_BLENDING
    worker_count: 4
    environment_sensitivity: 1.5

  - id: UNIT-13
    name: Contained Compression (Oncology Suite)
    sequence: 13
    process_stage: CONTAINED_COMPRESSION
    worker_count: 4
    environment_sensitivity: 1.7

  - id: UNIT-14
    name: Contained Coating (Oncology Suite)
    sequence: 14
    process_stage: CONTAINED_COATING
    worker_count: 4
    environment_sensitivity: 1.6
