      - {tag: temperature, delta_fraction: 0.28, delta_absolute: 6.0, curve: exponential, sigma_growth: 0.25}
      - {tag: vibration, delta_fraction: 0.45, curve: linear, sigma_growth: 0.30}
    effects:
      reject_rate_add: 0.035
      process_variability_gain: 0.45
    repair:
