# Failure modes, hazard model and precursor signatures.
#
# Failures are RANDOM AND RARE, but never a flat coin flip. For each machine and
# each applicable mode the engine evaluates a hazard:
#
#   lambda(t) = (beta/mtbf) * (h/mtbf)^(beta-1)
#               * age * operating_hours * maintenance_debt * load * environment * operator
#   P(initiate in dt) = 1 - exp(-lambda * dt)
#
# beta > 1 gives wear-out (probability rises with accumulated operating hours);
# beta == 1 gives a memoryless mode such as a grid interruption.
#
# When a mode initiates it does NOT fault immediately. An incubation period is
# sampled and the fault is SCHEDULED, during which the machine's degradation
# index climbs and drives the `precursors` below. That is what makes the
# observable causal chain of §16 real, and what makes exact remaining-useful-life
# labels possible. If maintenance intervenes first, the failure is AVERTED and
# labelled as such.
#
# Applicability: `sensor_profiles` matches classes that inherit those profiles;
# `equipment_classes` names classes directly. Both empty means every machine.

hazard_scale: 0.33          # global tuning knob for overall failure frequency
max_concurrent_modes: 2

# Each factor is a declarative curve over an engine-supplied driver (§14).
hazard_factors:
  age:
    intercept: 1.0
    terms: [{input: age_years, coef: 0.07}]
  operating_hours:
    intercept: 1.0
    terms: [{input: operating_khours, coef: 0.06}]
  maintenance_debt:
    intercept: 1.0
    terms: [{input: pm_overdue_ratio, coef: 0.9}]
    clip_max: 4.0
  load:
    intercept: 0.55
    terms: [{input: load_factor, coef: 0.45}]
  environment:
    intercept: 0.85
    terms: [{input: environment_stress, coef: 0.35}]
  operator:
    intercept: 0.95
    terms: [{input: operator_inexperience, coef: 0.30}]

failure_modes:

  # ======================= MECHANICAL =======================================
  # The canonical §42 chain: lubrication loss -> vibration, current and
  # temperature all climb together -> warning -> fault -> compression force
  # drifts high -> tablet hardness fails QC.
  - id: BEARING_FAILURE
    category: MECHANICAL
    description: Progressive bearing wear from lubrication breakdown.
    sensor_profiles: [tablet_press, granulator, blender, cone_mill, capsule_filler]
    mtbf_operating_hours: 3800.0
    weibull_beta: 2.4
    incubation_hours_min: 24.0
    incubation_hours_max: 168.0
    severity: MAJOR
    root_cause: INSUFFICIENT_LUBRICATION
    root_cause_description: Lubrication interval exceeded, allowing metal-to-metal contact.
    warning_threshold: 0.38
    precursors:
      - {tag: vibration, delta_fraction: 1.10, curve: exponential, sigma_growth: 0.65}
      - {tag: motor_current, delta_fraction: 0.18, curve: exponential, sigma_growth: 0.20}
      - {tag: temperature, delta_fraction: 0.20, delta_absolute: 8.0, curve: late_knee, sigma_growth: 0.15}
    effects:
      production_rate_factor: 0.0
      reject_rate_add: 0.055
      process_variability_gain: 0.60
      process_parameter_shifts:
        main_compression_force: 10.0
        tablet_weight: 20.0
        fill_weight: 14.0
    repair:
      duration_hours: 6.0
      cost: 1250.0
      parts: [bearing set, seal kit, lubricant]
      technicians: 2

