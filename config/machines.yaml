# Plant layout: 10 units, 100 machines. Machine ids are "<id_prefix>-<nnn>".
  # ---- Containment suite (UNIT-11 to UNIT-14) -----------------------------
  # Contained equipment for a highly potent compound. The signature difference
  # is the sign of the pressure: a potent suite is held BELOW the corridor so
  # that any leak pulls inwards and dust stays in, whereas a sterile suite is
  # held above so that contamination is pushed out. Getting that backwards is
  # the sort of error a containment engineer spots immediately.
  - id: contained_dispensing_isolator
    duty: coupled
    stage_duration_min: 110.0
    name: Contained Dispensing Isolator
    nominal_rate_per_hour: 180.0
    pm_interval_hours: 720.0
    base_reject_rate: 0.0008
    cleaning_duration_min: 95.0
    sensors:
      - tag: containment_pressure
        unit: Pa
        baseline: -42.0
        sigma: 2.1
        rho: 0.93
        drift_per_day: 0.06
        drift_limit: 9.0
        health_sensitivity: 0.55
        hard_min: -90.0
        hard_max: 15.0
        warn_high: -25.0
        alarm_high: -15.0
