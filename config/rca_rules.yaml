  # ---- ENVIRONMENTAL ------------------------------------------------------
  - id: RCA-HEPA-LOADING
    root_cause: HEPA_FILTER_LOADING
    categories: [ENVIRONMENTAL]
    evidence: [DP_DROP, HEPA_RISE, AIRFLOW_DROP, PM_OVERDUE]
    min_score: 2.6
    fishbone_category: ENVIRONMENT
    five_why:
      - Why did the room lose its pressure cascade? Supply airflow fell.
      - Why? Terminal HEPA filters were loaded.
      - Why? They were past their change-out point.
      - Why were they not changed? Change-out was scheduled annually regardless of loading.
      - Why? Filter differential pressure was recorded but not trended against a limit.
    corrective_action: Replace the HEPA and prefilter sets and re-balance the room.
    preventive_action: Trend filter differential pressure with a change-out alert, and re-qualify the cascade after each change.

