# Adverse events, CTCAE v5.0 grading, and what they do to dosing.
#
# Two things make this more than a table of random events.
#
# The grade drives the exposure. A Grade 3 non-haematological event interrupts
# dosing and the subject resumes one dose level down, so a subject who has a bad
# time on treatment receives less drug — and because the investigational arm has
# more Grade 3 events, its relative dose intensity comes out lower. That is a
# consequence of this file rather than a separate setting, and it is the property
# worth checking first.
#
# Attribution separates the chemotherapy backbone from the investigational
# product. Anaemia and neutropenia come from carboplatin and pemetrexed and
# appear in both arms at similar rates; diarrhoea and transaminase rises come
# from the KRAS inhibitor and are markedly higher on the active arm. An AE
# profile where everything is higher in the treatment arm is the tell that
# somebody scaled one list by a constant.
#
# MedDRA is licensed and not shipped. What is declared here is a subset with the
# hierarchy that coding actually uses, so the coded output has the right shape.

meddra_version: "26.1"
ctcae_version: "5.0"

# Grade 5 is death. It is never drawn from the grade weights -- a fatal event is
# decided by the survival model, not by an adverse-event table -- so the weights
# below only ever cover 1 to 4.
grades:
  - {grade: 1, label: Mild}
  - {grade: 2, label: Moderate}
  - {grade: 3, label: Severe or medically significant}
  - {grade: 4, label: Life-threatening}
  - {grade: 5, label: Death related to adverse event}

# Categories the dose-modification rules key on. Haematological toxicity is
# managed differently from everything else: it is expected, it recovers, and it
# is tolerated to a higher grade before the dose comes down.
categories:
  - {category: HAEMATOLOGICAL, description: Marrow suppression from the chemotherapy backbone}
  - {category: NON_HAEMATOLOGICAL, description: Everything else}

adverse_events:
  # ---- Investigational product ------------------------------------------
  - pt_code: "10012735"
    pt: Diarrhoea
    soc: Gastrointestinal disorders
    soc_code: "10017947"
    category: NON_HAEMATOLOGICAL
    attribution: INVESTIGATIONAL_PRODUCT
    incidence: {ARM-A: 0.61, ARM-B: 0.19}
    grade_weights: {1: 0.44, 2: 0.33, 3: 0.21, 4: 0.02}
