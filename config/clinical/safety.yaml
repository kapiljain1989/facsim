# What makes an event serious. Any one criterion is enough, which is the
# regulatory definition rather than a severity threshold -- a Grade 2 event
# requiring hospitalisation is serious and a Grade 3 one managed at home is not.
seriousness:
  criteria:
    - {criterion: DEATH, weight: 0.04}
    - {criterion: LIFE_THREATENING, weight: 0.09}
    - {criterion: HOSPITALISATION, weight: 0.62}
    - {criterion: DISABILITY, weight: 0.05}
    - {criterion: MEDICALLY_SIGNIFICANT, weight: 0.20}
  # Probability that an event of each grade is serious. Grade 4 is nearly always,
  # Grade 1 essentially never.
  probability_by_grade: {1: 0.002, 2: 0.021, 3: 0.24, 4: 0.86}

causality:
  # Investigator assessment of relatedness to the investigational product.
  # Attribution shifts it: an event the backbone is known to cause is more often
  # judged unrelated to the study drug.
  related_probability:
    INVESTIGATIONAL_PRODUCT: 0.82
    BOTH: 0.46
    CHEMOTHERAPY: 0.11

expedited_reporting:
  # A serious adverse event that is related and not already in the reference
  # safety information is a SUSAR, and the clock is regulatory.
  unexpected_probability: 0.22
  fatal_or_life_threatening_days: 7
  other_susar_days: 15
  # Days from the event to the site becoming aware, and from awareness to the
  # sponsor. Late awareness is what makes a reporting clock miss.
  site_awareness_days: {mean: 1.4, sd: 1.6}
  sponsor_notification_days: {mean: 1.8, sd: 2.0}
