# Sensor profiles: the ten sensor-bearing machine families of §11.
#
# A profile is reusable but never mandatory. machines.yaml may inherit one,
# patch individual tags, remove tags, or skip profiles entirely and declare
# sensors inline. No equipment-class-to-profile mapping is imposed anywhere.
#
# Every tag is a stochastic process, not a uniform draw:
#   rho              AR(1) coefficient — how strongly a sample remembers the last
#   sigma            measurement noise standard deviation
#   drift_per_day    slow bounded random-walk, in units/day
#   ambient_coupling how strongly plant temperature/humidity bleed in
#   health_sensitivity generic wear response, as a fraction of baseline at full
#                    degradation (failure-specific precursors live in failures.yaml)
#   state_factors    keyed by state id OR role name; a state id wins over a role
#   derived_from     tag mirrors real machine state instead of being generated

