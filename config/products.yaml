# Product catalogue. Nothing product-specific exists in Python: a new product is
# a block here, including its route, its setpoints and which QC tests apply.
#
# `manufacturing_process` lists process stages, which must be stages some unit
# performs (see units.yaml). `process_parameters` gives the setpoint and window
# per stage — these are the values QC transfer functions read, so changing a
# setpoint here genuinely changes downstream quality.

# Work in process. One batch occupies one machine at a time, so this is also the
# ceiling on how many batch-duty machines can be productive at once — it has to
# be sized against the bottleneck stage's capacity, not picked for looks.
max_concurrent_batches: 45

products:
  - product_id: PARA-500
    product_name: Paracetamol 500 mg Tablet
    dosage_form: TABLET
    batch_size: 300000
    target_quantity: 300000
    demand_weight: 3.0
    manufacturing_process:
      [DISPENSING, GRANULATION, DRYING, MILLING, BLENDING, COMPRESSION, COATING, PACKAGING]
    raw_materials:
      - {material_id: RM-PARA, name: Paracetamol API, quantity_kg: 150.0, variability: 0.018}
      - {material_id: RM-STARCH, name: Maize Starch, quantity_kg: 28.0, variability: 0.030}
      - {material_id: RM-PVP, name: Povidone K30, quantity_kg: 9.0, variability: 0.022}
      - {material_id: RM-MGST, name: Magnesium Stearate, quantity_kg: 2.4, variability: 0.025}
      - {material_id: RM-COAT, name: Film Coating Premix, quantity_kg: 6.5, variability: 0.020}
    process_parameters:
      DISPENSING:
        dispensed_weight: {target: 25.0, min: 24.6, max: 25.4, unit: kg}
      GRANULATION:
        impeller_speed: {target: 480.0, min: 420.0, max: 540.0, unit: rpm}
        granulation_time: {target: 18.0, min: 15.0, max: 22.0, unit: min}
      DRYING:
        inlet_temperature: {target: 62.0, min: 56.0, max: 68.0, unit: degC}
        drying_time: {target: 45.0, min: 38.0, max: 55.0, unit: min}
      MILLING:
        particle_size: {target: 240.0, min: 200.0, max: 290.0, unit: um}
      BLENDING:
        blend_time: {target: 22.0, min: 18.0, max: 27.0, unit: min}
        rpm: {target: 14.0, min: 11.0, max: 17.0, unit: rpm}
      COMPRESSION:
        main_compression_force: {target: 14.0, min: 11.5, max: 17.0, unit: kN}
        turret_speed: {target: 62.0, min: 50.0, max: 74.0, unit: rpm}
        tablet_weight: {target: 550.0, min: 533.5, max: 566.5, unit: mg}
      COATING:
        spray_rate: {target: 120.0, min: 100.0, max: 145.0, unit: g/min}
        inlet_temperature: {target: 58.0, min: 52.0, max: 66.0, unit: degC}
      PACKAGING:
        sealing_temperature: {target: 165.0, min: 155.0, max: 176.0, unit: degC}
    qc_specifications:
      [moisture_content, granule_size, blend_uniformity_rsd, tablet_weight_qc, tablet_hardness,
       tablet_thickness_qc, friability, disintegration_time, coating_weight_gain, appearance,
       dissolution, content_uniformity, assay, impurities, water_content]

