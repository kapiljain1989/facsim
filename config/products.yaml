  - product_id: VITC-500
    product_name: Vitamin C 500 mg Tablet
    dosage_form: TABLET
    batch_size: 400000
    target_quantity: 400000
    demand_weight: 1.5
    # Direct compression: no granulation, drying, milling or coating at all.
    # The QC transfer functions still work because absent inputs fall back to
