[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-factory-simulator"
version = "0.4.0"
description = "Config-driven, causal, reproducible pharmaceutical factory simulator with live streaming and polyglot storage"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kapil Jain" }]
keywords = ["simulation", "pharmaceutical", "industrial-iot", "digital-twin", "synthetic-data"]

dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "pyarrow>=15.0",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
clickhouse = ["clickhouse-driver>=0.2.7"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
pharma-sim = "pharma_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgres: requires a running PostgreSQL/TimescaleDB instance",
    "clickhouse: requires a running ClickHouse instance",
    "slow: long-running simulation tests",
]

[tool.coverage.run]
source = ["src/pharma_sim"]
